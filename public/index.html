<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jukebox Pix - Controle</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #1a1a2e; color: white; min-height: 100vh; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 25px; color: #00d4ff; }
        .maquina-selector { background: rgba(255,255,255,0.08); padding: 18px; border-radius: 8px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        select { padding: 8px 16px; font-size: 16px; border-radius: 4px; border: none; background: #00d4ff; color: #000; font-weight: bold; }
        .status-box { font-size: 18px; font-weight: bold; }
        .status-offline { color: #ff6b6b; }
        .status-online { color: #4ecdc4; }
        .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .card { background: rgba(255,255,255,0.08); padding: 20px; border-radius: 8px; text-align: center; }
        .card h3 { font-size: 14px; margin-bottom: 8px; color: #aaa; }
        .card .valor { font-size: 28px; font-weight: bold; }
        .faturamento { color: #00d4ff; }
        .comissao { color: #4ecdc4; }
        .botoes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 25px; }
        .btn { padding: 18px; font-size: 16px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; background: #00d4ff; color: #000; }
        .btn:nth-child(5) { grid-column: span 2; }
        .monitor { background: rgba(0,0,0,0.25); padding: 18px; border-radius: 8px; }
        .monitor h3 { margin-bottom: 12px; color: #aaa; font-size: 15px; }
        .log-item { padding: 6px 0; border-bottom: 1px solid #2a2a4a; font-family: monospace; font-size: 13px; }
        .log-ok { color: #4ecdc4; }
        .log-erro { color: #ff6b6b; }
        .log-envio { color: #ffd166; }
        .btn-zera { margin-top: 12px; padding: 8px 16px; background: #ff6b6b; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎰 Jukebox Pix</h1>

        <div class="maquina-selector">
            <div>
                <strong>Máquina:</strong> 
                <select id="maquina">
                    <option value="Box-01">Box-01 (Bancada Teste)</option>
                </select>
            </div>
            <div class="status-box" id="status">
                <span class="status-offline">● Sem conexão</span>
            </div>
        </div>

        <div class="cards">
            <div class="card">
                <h3>FATURAMENTO BRUTO</h3>
                <div class="valor faturamento" id="faturamento">R$ 0,00</div>
            </div>
            <div class="card">
                <h3>SUA COMISSÃO (50%)</h3>
                <div class="valor comissao" id="comissao">R$ 0,00</div>
            </div>
        </div>

        <h3 style="margin-bottom:12px; font-size:15px;">SIMULADOR DE CARGA MANUAL:</h3>
        <div class="botoes">
            <button class="btn" onclick="enviarPulso(2)">R$ 2,00 (2 Pulsos)</button>
            <button class="btn" onclick="enviarPulso(5)">R$ 5,00 (5 Pulsos)</button>
            <button class="btn" onclick="enviarPulso(10)">R$ 10,00 (10 Pulsos)</button>
            <button class="btn" onclick="enviarPulso(20)">R$ 20,00 (20 Pulsos)</button>
            <button class="btn" onclick="enviarPulso(50)">R$ 50,00 (50 Pulsos)</button>
        </div>

        <div class="monitor">
            <h3>MONITOR DE ENTRADAS PIX / PULSOS</h3>
            <div id="log"></div>
            <button class="btn-zera" onclick="zerarCaixa()">🔄 Zerar Caixa</button>
        </div>
    </div>

<script>
let ws;
let maquinaAtual = 'Box-01';
let dadosServidor = {};

function conectar() {
    ws = new WebSocket('wss://servidor-jukebox.onrender.com/');
    
    ws.onopen = function() {
        atualizarStatus('online');
        adicionarLog('✅ Conectado ao servidor — dados salvos na nuvem', 'log-ok');
    };
    
    ws.onmessage = function(event) {
        const msg = event.data;
        
        try {
            const dados = JSON.parse(msg);
            
            if (dados.tipo === 'dados') {
                dadosServidor = dados.maquinas || {};
                atualizarTela();
            }
            
            if (dados.tipo === 'atualizacao' && dados.nome === maquinaAtual) {
                if (!dadosServidor[dados.nome]) dadosServidor[dados.nome] = {};
                dadosServidor[dados.nome].faturamento = dados.valor;
                atualizarTela();
                adicionarLog(`💰 ${dados.nome}: R$ ${dados.valor.toFixed(2).replace('.', ',')}`, 'log-ok');
            }
            
            if (dados.tipo === 'zerar' && dados.nome === maquinaAtual) {
                if (dadosServidor[dados.nome]) dadosServidor[dados.nome].faturamento = 0;
                atualizarTela();
                adicionarLog('🔄 Caixa zerada no servidor', 'log-ok');
            }
            
        } catch(e) {
            if (msg.includes('conectado:Box-01') || msg.includes('status:Box-01:online')) {
                atualizarStatus('online');
                adicionarLog('✅ Box-01 está ONLINE', 'log-ok');
            }
        }
    };
    
    ws.onclose = function() {
        atualizarStatus('offline');
        adicionarLog('❌ Desconectado — tentando reconectar...', 'log-erro');
        setTimeout(conectar, 3000);
    };
}

function atualizarTela() {
    const valor = dadosServidor[maquinaAtual]?.faturamento || 0;
    document.getElementById('faturamento').textContent = 'R$ ' + valor.toFixed(2).replace('.', ',');
    document.getElementById('comissao').textContent = 'R$ ' + (valor * 0.5).toFixed(2).replace('.', ',');
}

function atualizarStatus(estado) {
    const el = document.getElementById('status');
    if (estado === 'online') {
        el.innerHTML = '<span class="status-online">● ONLINE</span>';
    } else {
        el.innerHTML = '<span class="status-offline">● Sem conexão</span>';
    }
}

function adicionarLog(texto, classe) {
    const log = document.getElementById('log');
    const agora = new Date();
    const horario = agora.toLocaleTimeString('pt-BR');
    log.innerHTML = `<div class="log-item ${classe}">[${horario}] ${texto}</div>` + log.innerHTML;
}

function enviarPulso(valor) {
    if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(`adicionar:${maquinaAtual}:${valor}`);
        ws.send(`pulso:${valor}`); // Avisa a caixinha pra dar o crédito
        adicionarLog(`➡️ Enviado: R$ ${valor},00`, 'log-envio');
    } else {
        adicionarLog('❌ Sem conexão com o servidor', 'log-erro');
    }
}

function zerarCaixa() {
    if (confirm('Tem certeza? Isso zera o caixa para sempre no servidor!')) {
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(`zerar:${maquinaAtual}`);
        }
    }
}

document.getElementById('maquina').addEventListener('change', function() {
    maquinaAtual = this.value;
    atualizarTela();
});

window.onload = conectar;
</script>
</body>
</html>
