<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jukebox Pix - Controle</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #00d4ff;
        }
        .maquina-selector {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        select {
            padding: 10px 20px;
            font-size: 18px;
            border-radius: 5px;
            border: none;
            background: #00d4ff;
            color: #000;
            font-weight: bold;
        }
        .status-box {
            font-size: 20px;
            font-weight: bold;
        }
        .status-offline {
            color: #ff6b6b;
        }
        .status-online {
            color: #4ecdc4;
        }
        .cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background: rgba(255,255,255,0.1);
            padding: 25px;
            border-radius: 10px;
            text-align: center;
        }
        .card h3 {
            font-size: 16px;
            margin-bottom: 10px;
            color: #aaa;
        }
        .card .valor {
            font-size: 32px;
            font-weight: bold;
        }
        .faturamento {
            color: #00d4ff;
        }
        .comissao {
            color: #4ecdc4;
        }
        .botoes {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }
        .btn {
            padding: 20px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #00d4ff;
            color: #000;
            transition: transform 0.2s;
        }
        .btn:hover {
            transform: scale(1.05);
        }
        .btn:last-child:nth-child(odd) {
            grid-column: span 2;
        }
        .monitor {
            background: rgba(0,0,0,0.3);
            padding: 20px;
            border-radius: 10px;
        }
        .monitor h3 {
            margin-bottom: 15px;
            color: #aaa;
        }
        .log-item {
            padding: 8px 10px 8px 0;
            border-bottom: 1px solid #333;
            font-family: monospace;
            font-size: 14px;
            position: relative;
        }
        .log-ok {
            color: #4ecdc4;
        }
        .log-erro {
            color: #ff6b6b;
        }
        .log-envio {
            color: #ffd166;
        }
        .btn-zera {
            margin-top: 15px;
            padding: 10px 20px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎰 Jukebox Pix</h1>

        <div class="maquina-selector">
            <div>
                <strong>Máquina:</strong> 
                <select id="maquina">
                    <option value="Box-01">Box-01 (Bancada Teste)</option>
                </select>
            </div>
            <div class="status-box" id="status">
                <span class="status-offline">● Sem conexão</span>
            </div>
        </div>

        <div class="cards">
            <div class="card">
                <h3>FATURAMENTO BRUTO</h3>
                <div class="valor faturamento" id="faturamento">R$ 0,00</div>
            </div>
            <div class="card">
                <h3>SUA COMISSÃO (50%)</h3>
                <div class="valor comissao" id="comissao">R$ 0,00</div>
            </div>
        </div>

        <h3 style="margin-bottom:15px">SIMULADOR DE CARGA MANUAL:</h3>
        <div class="botoes">
            <button class="btn" onclick="enviarPulso(2)">R$ 2,00 (2 Pulsos)</button>
            <button class="btn" onclick="enviarPulso(5)">R$ 5,00 (5 Pulsos)</button>
            <button class="btn" onclick="enviarPulso(10)">R$ 10,00 (10 Pulsos)</button>
            <button class="btn" onclick="enviarPulso(20)">R$ 20,00 (20 Pulsos)</button>
            <button class="btn" onclick="enviarPulso(50)">R$ 50,00 (50 Pulsos)</button>
        </div>

        <div class="monitor">
            <h3>MONITOR DE ENTRADAS PIX / PULSOS</h3>
            <div id="log"></div>
            <button class="btn-zera" onclick="zerarCaixa()">🔄 Zerar Caixa de Box-01</button>
        </div>
    </div>

<script>
// ========== CONEXÃO WEBSOCKET ==========
let ws;
let faturamento = 0;

function conectar() {
    const url = window.location.href.replace('http://', 'wss://').replace('https://', 'wss://').replace('/index.html', '/').replace('/', '/ws');
    ws = new WebSocket('wss://servidor-jukebox.onrender.com/');
    
    ws.onopen = function() {
        console.log('✅ Painel conectado ao servidor');
        atualizarStatus('online');
        adicionarLog('✅ Conectado ao servidor', 'log-ok');
    };
    
    ws.onmessage = function(event) {
        console.log('📩 Recebido:', event.data);
        const msg = event.data;
        
        if (msg.includes('conectado:Box-01') || msg.includes('status:Box-01:online')) {
            atualizarStatus('online');
            adicionarLog('✅ Box-01 está ONLINE', 'log-ok');
        }
        
        if (msg.includes('status:Box-01:offline') || msg.includes('Caixinha desconectou')) {
            atualizarStatus('offline');
        }
        
        if (msg.includes('R$') || msg.includes('pulso') || msg.includes('carga')) {
            adicionarLog('📩 ' + msg, 'log-ok');
        }
    };
    
    ws.onclose = function() {
        atualizarStatus('offline');
        adicionarLog('❌ Desconectado — tentando reconectar...', 'log-erro');
        setTimeout(conectar, 3000);
    };
    
    ws.onerror = function() {
        atualizarStatus('offline');
    };
}

function atualizarStatus(estado) {
    const el = document.getElementById('status');
    if (estado === 'online') {
        el.innerHTML = '<span class="status-online">● ONLINE</span>';
    } else {
        el.innerHTML = '<span class="status-offline">● Sem conexão</span>';
    }
}

function adicionarLog(texto, classe) {
    const log = document.getElementById('log');
    const agora = new Date();
    const horario = agora.toLocaleTimeString('pt-BR');
    log.innerHTML = `<div class="log-item ${classe}">[${horario}] ${texto}</div>` + log.innerHTML;
}

function enviarPulso(valor) {
    if (ws && ws.readyState === WebSocket.OPEN) {
        const msg = `pulso:${valor}`;
        ws.send(msg);
        adicionarLog(`➡️ Enviado: R$ ${valor},00`, 'log-envio');
        
        faturamento += valor;
        document.getElementById('faturamento').textContent = `R$ ${faturamento.toFixed(2).replace('.', ',')}`;
        document.getElementById('comissao').textContent = `R$ ${(faturamento * 0.5).toFixed(2).replace('.', ',')}`;
    } else {
        adicionarLog('❌ Sem conexão com o servidor', 'log-erro');
    }
}

function zerarCaixa() {
    if (confirm('Tem certeza que deseja zerar o caixa?')) {
        faturamento = 0;
        document.getElementById('faturamento').textContent = 'R$ 0,00';
        document.getElementById('comissao').textContent = 'R$ 0,00';
        adicionarLog('🔄 Caixa zerada', 'log-ok');
    }
}

// Inicia quando a página carregar
window.onload = function() {
    conectar();
};
</script>
</body>
</html>
